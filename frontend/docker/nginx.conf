# Service des actifs statiques KALYCE — compression, cache immuable, en-têtes.
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/manifest+json;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (ADR-0002).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Actifs hachés par Vite : immuables, cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # Le service worker et le manifeste ne doivent jamais être figés en cache.
    location = /sw.js            { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

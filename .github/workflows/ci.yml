name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_NAME: kalyce
  DB_USER: postgres
  DB_PASSWORD: postgres
  REDIS_URL: redis://127.0.0.1:6379/0

jobs:
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff black isort
      - run: ruff check .
      - run: black --check .
      - run: isort --check-only .

  migrations:
    name: Migrations (no drift, applies cleanly)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kalyce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Aucune migration manquante
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy --fail-level WARNING
        env: { DJANGO_SETTINGS_MODULE: config.settings.prod, SECRET_KEY: ci-only-secret-key-000000000000 }
        continue-on-error: true

  tests:
    name: Tests + couverture
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kalyce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt coverage pytest-cov
      - name: Suite de tests avec couverture
        run: pytest -q --cov=apps --cov=config --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Jeu de démonstration end-to-end
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --reset
      - name: Schéma OpenAPI
        run: python manage.py spectacular --file openapi.yaml --fail-on-warn || python manage.py spectacular --file openapi.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            backend/coverage.xml
            backend/openapi.yaml
